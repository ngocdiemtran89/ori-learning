<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORI Learning — Hệ Thống Học Tập TOEIC</title>
<meta name="description" content="Nền tảng học TOEIC toàn diện từ ORI Academy. Luyện Part 1-7, AI Planner, Từ vựng, Test đầu vào.">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--sidebar:#0d1224;--card:#141830;--border:#1e2642;
  --accent:#6C5CE7;--accent2:#a29bfe;--accent-glow:rgba(108,92,231,0.15);
  --teal:#00cec9;--teal-glow:rgba(0,206,201,0.12);
  --green:#00b894;--red:#ff6b6b;--orange:#fdcb6e;--blue:#74b9ff;
  --text:#fff;--text2:#b2bec3;--text3:#636e72;
  --radius:12px;--sh:0 4px 20px rgba(0,0,0,0.3);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);display:flex}

/* SIDEBAR */
.sidebar{width:260px;min-height:100vh;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:transform .25s}
.sb-brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sb-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),var(--teal));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff}
.sb-title{font-size:15px;font-weight:700}
.sb-title span{display:block;font-size:11px;font-weight:400;color:var(--text2);margin-top:2px}
.sb-nav{flex:1;padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sb-section{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:16px 14px 6px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border:none;background:transparent;color:var(--text2);font-size:13px;font-family:inherit;border-radius:8px;cursor:pointer;transition:all .15s;text-align:left;width:100%}
.sb-item:hover{background:var(--accent-glow);color:var(--text)}
.sb-item.active{background:var(--accent-glow);color:var(--accent2);font-weight:600;border-left:3px solid var(--accent)}
.sb-item .ico{font-size:16px;width:24px;text-align:center}
.sb-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.sb-footer{padding:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);text-align:center}
.sb-footer a{color:var(--accent2);text-decoration:none}

/* MOBILE */
.mob-header{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:var(--sidebar);border-bottom:1px solid var(--border);align-items:center;padding:0 14px;z-index:90;gap:10px}
.mob-header h1{font-size:14px;flex:1;background:linear-gradient(135deg,var(--accent),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hamburger{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:95}

/* MAIN */
.main{margin-left:260px;flex:1;height:100vh;display:flex;flex-direction:column}
.main iframe{flex:1;width:100%;height:100%;border:none}

/* DASHBOARD */
.dash{flex:1;overflow-y:auto;padding:30px}
.dash-head{margin-bottom:24px}
.dash-head h2{font-size:22px;font-weight:800}
.dash-head p{color:var(--text2);font-size:13px;margin-top:4px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;opacity:0;transition:opacity .2s}
.dash-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--sh)}
.dash-card:hover::before{opacity:1}
.dash-card .dc-ico{font-size:28px;margin-bottom:10px}
.dash-card .dc-name{font-size:15px;font-weight:700;margin-bottom:4px}
.dash-card .dc-desc{font-size:12px;color:var(--text2);line-height:1.5}
.dash-card .dc-tag{display:inline-block;margin-top:10px;font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600}
.c1::before{background:linear-gradient(90deg,#6C5CE7,#a29bfe)}.c1 .dc-tag{background:rgba(108,92,231,0.15);color:#a29bfe}
.c2::before{background:linear-gradient(90deg,#00cec9,#55efc4)}.c2 .dc-tag{background:rgba(0,206,201,0.12);color:#00cec9}
.c3::before{background:linear-gradient(90deg,#ff6b6b,#fab1a0)}.c3 .dc-tag{background:rgba(255,107,107,0.12);color:#ff6b6b}
.c4::before{background:linear-gradient(90deg,#fdcb6e,#ffeaa7)}.c4 .dc-tag{background:rgba(253,203,110,0.12);color:#fdcb6e}
.c5::before{background:linear-gradient(90deg,#74b9ff,#0984e3)}.c5 .dc-tag{background:rgba(116,185,255,0.12);color:#74b9ff}
.c6::before{background:linear-gradient(90deg,#00b894,#55efc4)}.c6 .dc-tag{background:rgba(0,184,148,0.12);color:#00b894}
.c7::before{background:linear-gradient(90deg,#e17055,#d63031)}.c7 .dc-tag{background:rgba(225,112,85,0.12);color:#e17055}
.welcome-banner{background:linear-gradient(135deg,var(--accent),#4834d4,var(--teal));border-radius:var(--radius);padding:28px;margin-bottom:24px;position:relative;overflow:hidden}
.welcome-banner h3{font-size:18px;font-weight:800;margin-bottom:6px}
.welcome-banner p{font-size:13px;opacity:.85;line-height:1.6}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .mob-header{display:flex}
  .sb-overlay.show{display:block}
  .main{margin-left:0;padding-top:54px}
  .dash{padding:16px}
  .dash-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="sb-overlay" id="overlay" onclick="toggleSB()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sb-brand">
    <div class="sb-logo">ORI</div>
    <div class="sb-title">ORI Learning<span>TOEIC · Việc Làm · Hay Dùng</span></div>
  </div>
  <nav class="sb-nav">
    <div class="sb-section">Tổng quan</div>
    <button class="sb-item active" onclick="go('home')"><span class="ico">🏠</span> Trang Chủ</button>
    <button class="sb-item" onclick="go('planner')"><span class="ico">🤖</span> AI Study Planner<span class="badge">AI</span></button>
    <button class="sb-item" onclick="go('placement')"><span class="ico">📝</span> Test Đầu Vào</button>

    <div class="sb-section">Luyện TOEIC</div>
    <button class="sb-item" onclick="go('part1')"><span class="ico">📸</span> Part 1 — Photographs</button>
    <button class="sb-item" onclick="go('part2')"><span class="ico">🎧</span> Part 2 — Q&A</button>
    <button class="sb-item" onclick="go('part5')"><span class="ico">📖</span> Part 5 — Grammar<span class="badge">🔥</span></button>
    <button class="sb-item" onclick="go('part7')"><span class="ico">📑</span> Part 7 — Reading</button>

    <div class="sb-section">Công cụ</div>
    <button class="sb-item" onclick="go('vocab')"><span class="ico">📚</span> Từ Vựng TOEIC</button>
    <button class="sb-item" onclick="go('quiz')"><span class="ico">🎯</span> Quiz Tổng Hợp</button>
    <button class="sb-item" onclick="go('recommend')"><span class="ico">🧭</span> Gợi Ý Khóa Học</button>
  </nav>
  <div class="sb-footer">© 2026 <a href="https://zalo.me/0906303373" target="_blank">ORI Academy</a> · <a href="tel:0906303373" style="color:var(--teal);text-decoration:none">0906 303 373</a></div>
</aside>

<header class="mob-header">
  <button class="hamburger" onclick="toggleSB()">☰</button>
  <h1>ORI Learning</h1>
</header>

<main class="main" id="main">
  <!-- Dashboard or iframe loads here -->
</main>

<script>
var TOOLS = {
  planner:   {url:'https://ori-toeic-planner.vercel.app', name:'AI Study Planner'},
  placement: {url:'https://ori-toeic-placement-test.vercel.app', name:'Test Đầu Vào'},
  part1:     {url:'https://ori-toeic-part1.vercel.app', name:'Part 1 — Photographs'},
  part2:     {url:'https://toeic-part2-app.vercel.app', name:'Part 2 — Q&A'},
  part5:     {url:'https://ori-part5-grammar.vercel.app', name:'Part 5 — Grammar'},
  part7:     {url:'https://part-7-toeic-ori.vercel.app', name:'Part 7 — Reading'},
  vocab:     {url:'https://ori-toeic-vocab.vercel.app', name:'Từ Vựng TOEIC'},
  quiz:      {url:'https://ori-toeic-quiz.vercel.app', name:'Quiz Tổng Hợp'},
  recommend: {url:'https://ori-course-recommender.vercel.app', name:'Gợi Ý Khóa Học'}
};

function toggleSB(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function go(page){
  // Update sidebar active
  document.querySelectorAll('.sb-item').forEach(function(b){b.classList.remove('active')});
  var btns = document.querySelectorAll('.sb-item');
  btns.forEach(function(b){if(b.textContent.toLowerCase().indexOf(page)>=0 || b.getAttribute('onclick').indexOf("'"+page+"'")>=0) b.classList.add('active')});

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');

  if(page === 'home'){
    renderDashboard();
    return;
  }

  var tool = TOOLS[page];
  if(!tool) return;
  document.getElementById('main').innerHTML = '<iframe src="'+tool.url+'" allow="microphone; clipboard-write"></iframe>';
}

function renderDashboard(){
  var cards = [
    {key:'planner',ico:'🤖',name:'AI Study Planner',desc:'AI lập kế hoạch học tập TOEIC cá nhân hóa theo điểm số và mục tiêu.',tag:'Trí tuệ nhân tạo',cls:'c1'},
    {key:'placement',ico:'📝',name:'Test Đầu Vào',desc:'Kiểm tra trình độ hiện tại để ORI tư vấn khóa học phù hợp nhất.',tag:'Miễn phí',cls:'c2'},
    {key:'part1',ico:'📸',name:'Part 1 — Photographs',desc:'Luyện mô tả hình ảnh với 6 câu/đề. Nghe audio và chọn câu đúng.',tag:'Listening',cls:'c3'},
    {key:'part2',ico:'🎧',name:'Part 2 — Q&A',desc:'Luyện nghe câu hỏi-đáp. Phản xạ nhanh với 25 câu mỗi bộ đề.',tag:'Listening',cls:'c4'},
    {key:'part5',ico:'📖',name:'Part 5 — Grammar',desc:'Từ loại, ngữ pháp, từ vựng. AI tạo đề và giải thích chi tiết.',tag:'Reading · AI',cls:'c5'},
    {key:'part7',ico:'📑',name:'Part 7 — Reading',desc:'Đọc hiểu bài passage. Tư duy và mẹo làm bài từ chuyên gia ORI.',tag:'Reading',cls:'c6'},
    {key:'vocab',ico:'📚',name:'Từ Vựng TOEIC',desc:'Phân loại từ vựng theo band điểm 450-800+. Học đúng cấp độ.',tag:'Vocabulary',cls:'c7'},
    {key:'quiz',ico:'🎯',name:'Quiz Tổng Hợp',desc:'Mini quiz kết hợp nhiều Part để kiểm tra kiến thức tổng quát.',tag:'Mixed',cls:'c1'},
    {key:'recommend',ico:'🧭',name:'Gợi Ý Khóa Học',desc:'Nhập thông tin để ORI gợi ý khóa học và lộ trình phù hợp nhất.',tag:'Tư vấn',cls:'c2'}
  ];

  var h = '<div class="dash"><div class="welcome-banner"><h3>👋 Chào mừng đến ORI Learning!</h3><p>Nền tảng học TOEIC toàn diện từ ORI Academy — Luyện Part 1-7, AI lập kế hoạch, Từ vựng theo band điểm.<br><strong>TOEIC · Việc Làm · Hay Dùng</strong> &nbsp;—&nbsp; <a href="https://zalo.me/0906303373" target="_blank" style="color:#fff;text-decoration:underline;font-weight:600">💬 Nhắn Zalo tư vấn miễn phí</a></p></div>';
  h += '<div class="dash-head"><h2>🎓 Công Cụ Học Tập</h2><p>Chọn công cụ để bắt đầu luyện tập ngay</p></div>';
  h += '<div class="dash-grid">';
  cards.forEach(function(c){
    h += '<div class="dash-card '+c.cls+'" onclick="go(\''+c.key+'\')">';
    h += '<div class="dc-ico">'+c.ico+'</div>';
    h += '<div class="dc-name">'+c.name+'</div>';
    h += '<div class="dc-desc">'+c.desc+'</div>';
    h += '<span class="dc-tag">'+c.tag+'</span>';
    h += '</div>';
  });
  h += '</div></div>';
  document.getElementById('main').innerHTML = h;
}

// Init
renderDashboard();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORI Learning — Hệ Thống Học Tập TOEIC</title>
<meta name="description" content="Nền tảng học TOEIC toàn diện từ ORI Academy. Luyện Part 1-7, AI Planner, Từ vựng, Test đầu vào. TOEIC · Việc Làm · Hay Dùng.">
<meta name="theme-color" content="#0a0e1a">
<meta property="og:title" content="ORI Learning — Hệ Thống Học Tập TOEIC">
<meta property="og:description" content="Nền tảng học TOEIC toàn diện từ ORI Academy — Luyện Part 1-7, AI Study Planner, Từ vựng theo band điểm.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ori-learning.vercel.app">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--sidebar:#0d1224;--card:#141830;--border:#1e2642;
  --accent:#6C5CE7;--accent2:#a29bfe;--accent-glow:rgba(108,92,231,0.15);
  --teal:#00cec9;--teal-glow:rgba(0,206,201,0.12);
  --green:#00b894;--red:#ff6b6b;--orange:#fdcb6e;--blue:#74b9ff;
  --text:#fff;--text2:#b2bec3;--text3:#636e72;
  --radius:12px;--sh:0 4px 20px rgba(0,0,0,0.3);
  --transition:.25s cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);display:flex}

/* SIDEBAR */
.sidebar{width:260px;min-height:100vh;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:transform var(--transition)}
.sb-brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sb-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),var(--teal));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;box-shadow:0 4px 15px rgba(108,92,231,0.3)}
.sb-title{font-size:15px;font-weight:700}
.sb-title span{display:block;font-size:11px;font-weight:400;color:var(--text2);margin-top:2px}
.sb-nav{flex:1;padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sb-section{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:16px 14px 6px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border:none;background:transparent;color:var(--text2);font-size:13px;font-family:inherit;border-radius:8px;cursor:pointer;transition:all .15s;text-align:left;width:100%;position:relative}
.sb-item:hover{background:var(--accent-glow);color:var(--text)}
.sb-item.active{background:var(--accent-glow);color:var(--accent2);font-weight:600;border-left:3px solid var(--accent)}
.sb-item .ico{font-size:16px;width:24px;text-align:center}
.sb-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.sb-item .badge-hot{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.sb-item .badge-soon{margin-left:auto;background:rgba(253,203,110,0.15);color:var(--orange);font-size:9px;padding:2px 6px;border-radius:10px;font-weight:600}
.sb-item.disabled{opacity:.45;pointer-events:none}
.sb-footer{padding:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);text-align:center}
.sb-footer a{color:var(--accent2);text-decoration:none}

/* MOBILE */
.mob-header{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:var(--sidebar);border-bottom:1px solid var(--border);align-items:center;padding:0 14px;z-index:90;gap:10px}
.mob-header h1{font-size:14px;flex:1;background:linear-gradient(135deg,var(--accent),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.hamburger{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:95;opacity:0;transition:opacity var(--transition)}
.sb-overlay.show{display:block;opacity:1}

/* MAIN */
.main{margin-left:260px;flex:1;height:100vh;display:flex;flex-direction:column}

/* TOOL HEADER BAR (when viewing a tool) */
.tool-header{height:48px;background:var(--sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;animation:slideDown .3s ease-out}
.tool-header .back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .15s}
.tool-header .back-btn:hover{background:var(--accent-glow);color:var(--text);border-color:var(--accent)}
.tool-header .tool-name{font-size:13px;font-weight:600;color:var(--text)}
.tool-header .tool-badge{font-size:10px;color:var(--accent2);background:var(--accent-glow);padding:2px 8px;border-radius:10px}

/* IFRAME CONTAINER */
.iframe-wrap{flex:1;position:relative}
.iframe-wrap iframe{width:100%;height:100%;border:none}
.iframe-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:5;transition:opacity .4s}
.iframe-loader.hidden{opacity:0;pointer-events:none}
.loader-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.loader-text{margin-top:14px;font-size:13px;color:var(--text2)}
.open-newtab{margin-top:18px;display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s}
.open-newtab:hover{background:#5b4bd5;transform:translateY(-2px)}
.name-input{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-family:inherit;font-size:13px;width:100%;max-width:280px;outline:none;transition:border .2s}
.name-input:focus{border-color:var(--accent)}
.name-input::placeholder{color:var(--text3)}
.path-guide{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px}
.path-guide h4{font-size:14px;font-weight:700;margin-bottom:10px}
.path-steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.path-step{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--accent-glow);border-radius:20px;font-size:11px;font-weight:600;color:var(--accent2);cursor:pointer;transition:all .15s}
.path-step:hover{background:var(--accent);color:#fff}
.path-arrow{color:var(--text3);font-size:14px}
.coming-card{opacity:.5;cursor:default!important}
.coming-card:hover{transform:none!important;border-color:var(--border)!important;box-shadow:none!important}
.coming-badge{position:absolute;top:12px;right:12px;background:rgba(253,203,110,0.15);color:var(--orange);font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* DASHBOARD */
.dash{flex:1;overflow-y:auto;padding:30px;animation:fadeIn .4s ease-out}
.dash-head{margin-bottom:24px}
.dash-head h2{font-size:22px;font-weight:800}
.dash-head p{color:var(--text2);font-size:13px;margin-top:4px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;opacity:0;transition:opacity .2s}
.dash-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--sh)}
.dash-card:hover::before{opacity:1}
.dash-card .dc-ico{font-size:28px;margin-bottom:10px}
.dash-card .dc-name{font-size:15px;font-weight:700;margin-bottom:4px}
.dash-card .dc-desc{font-size:12px;color:var(--text2);line-height:1.5}
.dash-card .dc-tag{display:inline-block;margin-top:10px;font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600}
.c1::before{background:linear-gradient(90deg,#6C5CE7,#a29bfe)}.c1 .dc-tag{background:rgba(108,92,231,0.15);color:#a29bfe}
.c2::before{background:linear-gradient(90deg,#00cec9,#55efc4)}.c2 .dc-tag{background:rgba(0,206,201,0.12);color:#00cec9}
.c3::before{background:linear-gradient(90deg,#ff6b6b,#fab1a0)}.c3 .dc-tag{background:rgba(255,107,107,0.12);color:#ff6b6b}
.c4::before{background:linear-gradient(90deg,#fdcb6e,#ffeaa7)}.c4 .dc-tag{background:rgba(253,203,110,0.12);color:#fdcb6e}
.c5::before{background:linear-gradient(90deg,#74b9ff,#0984e3)}.c5 .dc-tag{background:rgba(116,185,255,0.12);color:#74b9ff}
.c6::before{background:linear-gradient(90deg,#00b894,#55efc4)}.c6 .dc-tag{background:rgba(0,184,148,0.12);color:#00b894}
.c7::before{background:linear-gradient(90deg,#e17055,#d63031)}.c7 .dc-tag{background:rgba(225,112,85,0.12);color:#e17055}
.welcome-banner{background:linear-gradient(135deg,var(--accent),#4834d4,var(--teal));border-radius:var(--radius);padding:28px;margin-bottom:24px;position:relative;overflow:hidden;animation:slideUp .5s ease-out}
.welcome-banner::after{content:'';position:absolute;top:-50%;right:-30%;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 70%);pointer-events:none}
.welcome-banner h3{font-size:18px;font-weight:800;margin-bottom:6px}
.welcome-banner p{font-size:13px;opacity:.85;line-height:1.6}
.welcome-banner .wb-cta{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 18px;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;text-decoration:none;font-size:12px;font-weight:600;transition:all .2s}
.welcome-banner .wb-cta:hover{background:rgba(255,255,255,0.25);transform:translateY(-1px)}

/* SECTION DIVIDER */
.section-title{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin:28px 0 14px;font-weight:600;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* STAT CARDS */
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;animation:slideUp .4s ease-out}
.stat-card .stat-val{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .stat-lbl{font-size:11px;color:var(--text3);margin-top:4px}

/* ERROR STATE */
.error-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px;text-align:center}
.error-state .error-ico{font-size:48px;margin-bottom:16px}
.error-state h3{font-size:18px;font-weight:700;margin-bottom:8px}
.error-state p{font-size:13px;color:var(--text2);margin-bottom:20px;max-width:400px;line-height:1.6}
.error-state .retry-btn{background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.error-state .retry-btn:hover{background:#5b4bd5;transform:translateY(-2px)}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .mob-header{display:flex}
  .sb-overlay.show{display:block}
  .main{margin-left:0;padding-top:54px}
  .dash{padding:16px}
  .dash-grid{grid-template-columns:1fr}
  .welcome-banner{padding:20px}
  .welcome-banner h3{font-size:16px}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .tool-header{padding:0 10px}
  .tool-header .tool-name{font-size:12px}
  .path-steps{flex-direction:column;align-items:stretch}
  .path-step{justify-content:center}
  .path-arrow{display:none}
}
</style>
</head>
<body>

<div class="sb-overlay" id="overlay" onclick="toggleSB()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sb-brand">
    <div class="sb-logo">ORI</div>
    <div class="sb-title">ORI Learning<span>TOEIC · Việc Làm · Hay Dùng</span></div>
  </div>
  <nav class="sb-nav">
    <div class="sb-section">Tổng quan</div>
    <button class="sb-item active" data-key="home" onclick="go('home')"><span class="ico">🏠</span> Trang Chủ</button>
    <button class="sb-item" data-key="planner" onclick="go('planner')"><span class="ico">🤖</span> AI Study Planner<span class="badge">AI</span></button>
    <button class="sb-item" data-key="placement" onclick="go('placement')"><span class="ico">📝</span> Test Đầu Vào</button>

    <div class="sb-section">Luyện TOEIC</div>
    <button class="sb-item" data-key="part1" onclick="go('part1')"><span class="ico">📸</span> Part 1 — Photographs</button>
    <button class="sb-item" data-key="part2" onclick="go('part2')"><span class="ico">🎧</span> Part 2 — Q&A</button>
    <button class="sb-item disabled"><span class="ico">💬</span> Part 3/4 — Conversations<span class="badge-soon">Soon</span></button>
    <button class="sb-item" data-key="part5" onclick="go('part5')"><span class="ico">📖</span> Part 5 — Grammar<span class="badge-hot">🔥</span></button>
    <button class="sb-item" data-key="part6" onclick="go('part6')"><span class="ico">📄</span> Part 6 — Text Completion<span class="badge-hot">New</span></button>
    <button class="sb-item" data-key="part7" onclick="go('part7')"><span class="ico">📑</span> Part 7 — Reading</button>

    <div class="sb-section">Công cụ</div>
    <button class="sb-item" data-key="vocab" onclick="go('vocab')"><span class="ico">📚</span> Từ Vựng TOEIC</button>
    <button class="sb-item" data-key="quiz" onclick="go('quiz')"><span class="ico">✈️</span> Quiz Aviation<span class="badge-hot">New</span></button>
    <button class="sb-item" data-key="recommend" onclick="go('recommend')"><span class="ico">🧭</span> Gợi Ý Khóa Học</button>
  </nav>
  <div class="sb-footer">
    <div style="margin-bottom:6px;font-weight:600;color:var(--accent2)">📞 Tư vấn miễn phí</div>
    <a href="https://zalo.me/0906303373" target="_blank" style="color:var(--teal)">💬 Nhắn Zalo ORI</a> · <a href="tel:0906303373" style="color:var(--teal);text-decoration:none">0906 303 373</a>
    <div style="margin-top:8px;opacity:.6">© 2026 ORI Academy</div>
  </div>
</aside>

<header class="mob-header">
  <button class="hamburger" onclick="toggleSB()" aria-label="Mở menu">☰</button>
  <h1>ORI Learning</h1>
</header>

<main class="main" id="main">
  <!-- Dashboard or tool loads here -->
</main>

<script>
var TOOLS = {
  planner:   {url:'https://ori-toeic-planner.vercel.app', name:'AI Study Planner', tag:'Trí tuệ nhân tạo'},
  placement: {url:'https://ori-toeic-placement-test.vercel.app', name:'Test Đầu Vào', tag:'Miễn phí'},
  part1:     {url:'https://ori-toeic-part1.vercel.app', name:'Part 1 — Photographs', tag:'Listening'},
  part2:     {url:'https://toeic-part2-app.vercel.app', name:'Part 2 — Q&A', tag:'Listening'},
  part5:     {url:'https://ori-part5-grammar.vercel.app', name:'Part 5 — Grammar', tag:'Reading · AI'},
  part6:     {url:'/part6.html', name:'Part 6 — Text Completion', tag:'Reading'},
  part7:     {url:'https://part-7-toeic-ori.vercel.app', name:'Part 7 — Reading', tag:'Reading'},
  vocab:     {url:'https://ori-toeic-vocab.vercel.app', name:'Từ Vựng TOEIC', tag:'Vocabulary'},
  quiz:      {url:'https://ori-toeic-cabin-crew-quiz.vercel.app', name:'Quiz Aviation TOEIC', tag:'Test Bank'},
  recommend: {url:'https://ori-course-recommender.vercel.app', name:'Gợi Ý Khóa Học', tag:'Tư vấn'}
};

var currentPage = 'home';

function toggleSB(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function go(page){
  // Update sidebar active
  document.querySelectorAll('.sb-item').forEach(function(b){b.classList.remove('active')});
  var target = document.querySelector('.sb-item[data-key="'+page+'"]');
  if(target) target.classList.add('active');

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');

  currentPage = page;

  if(page === 'home'){
    renderDashboard();
    return;
  }

  var tool = TOOLS[page];
  if(!tool) return;

  // Build tool view with header + loading spinner + iframe
  var h = '<div class="tool-header">';
  h += '<button class="back-btn" onclick="go(\'home\')">← Trang chủ</button>';
  h += '<span class="tool-name">'+tool.name+'</span>';
  h += '<span class="tool-badge">'+tool.tag+'</span>';
  h += '<a href="'+tool.url+'" target="_blank" style="margin-left:auto;color:var(--text3);font-size:11px;text-decoration:none" title="Mở trong tab mới">↗ Tab mới</a>';
  h += '</div>';
  h += '<div class="iframe-wrap">';
  h += '<div class="iframe-loader" id="iframe-loader">';
  h += '<div class="loader-spinner"></div>';
  h += '<div class="loader-text">Đang tải '+tool.name+'...</div>';
  h += '<a class="open-newtab" href="'+tool.url+'" target="_blank" style="display:none" id="fallback-link">🔗 Mở trực tiếp trong tab mới</a>';
  h += '</div>';
  h += '<iframe src="'+tool.url+'" allow="microphone; clipboard-write" id="tool-iframe" onload="onIframeLoad()" onerror="onIframeError()"></iframe>';
  h += '</div>';
  document.getElementById('main').innerHTML = h;

  // After 6s, if still loading show fallback link
  setTimeout(function(){
    var loader = document.getElementById('iframe-loader');
    var fb = document.getElementById('fallback-link');
    if(loader && !loader.classList.contains('hidden')){
      if(fb) fb.style.display = 'inline-flex';
      var lt = document.querySelector('.loader-text');
      if(lt) lt.textContent = 'Tải chậm? Thử mở trực tiếp:';
    }
  }, 6000);
  // Hard timeout — hide loader after 10s
  setTimeout(function(){
    var loader = document.getElementById('iframe-loader');
    if(loader) loader.classList.add('hidden');
  }, 10000);
}

function onIframeLoad(){
  var loader = document.getElementById('iframe-loader');
  if(loader) loader.classList.add('hidden');
}

function onIframeError(){
  var loader = document.getElementById('iframe-loader');
  if(loader) loader.classList.add('hidden');
  // Show error state (though most iframe errors don't trigger this)
}

function getGreeting(){
  var h = new Date().getHours();
  var name = localStorage.getItem('ori_name') || '';
  var hi = name ? ' '+name+'!' : '';
  if(h < 12) return '🌅 Chào buổi sáng'+hi;
  if(h < 18) return '☀️ Chào buổi chiều'+hi;
  return '🌙 Chào buổi tối'+hi;
}
function saveName(el){ localStorage.setItem('ori_name', el.value.trim()); }

function renderDashboard(){
  var cards = [
    {key:'planner',ico:'🤖',name:'AI Study Planner',desc:'AI lên lộ trình riêng cho bạn — biết yếu Part nào, tập Part đó. Có theo dõi tiến độ hàng ngày.',tag:'Trí tuệ nhân tạo',cls:'c1'},
    {key:'placement',ico:'📝',name:'Test Đầu Vào',desc:'Làm 20 câu nhanh để ORI biết bạn đang ở level nào → tư vấn đúng khóa. Miễn phí 100%.',tag:'Miễn phí',cls:'c2'},
    {key:'part1',ico:'📸',name:'Part 1 — Photographs',desc:'Nghe mô tả ảnh, chọn câu đúng. Luyện phản xạ nghe — chỉ cần 5 phút/ngày.',tag:'Listening',cls:'c3'},
    {key:'part2',ico:'🎧',name:'Part 2 — Q&A',desc:'Câu hỏi-đáp nhanh — loại bỏ bẫy, tập trung từ khóa. 25 câu/bộ đề thực chiến.',tag:'Listening',cls:'c4'},
    {key:'part5',ico:'📖',name:'Part 5 — Grammar',desc:'Bài tập từ loại, ngữ pháp, từ vựng — AI giải thích chi tiết từng câu. 120+ câu hỏi.',tag:'Reading · AI',cls:'c5'},
    {key:'part7',ico:'📑',name:'Part 7 — Reading',desc:'Đọc passage + trả lời — học tư duy scan/skim từ chuyên gia ORI. Mẹo tiết kiệm thời gian.',tag:'Reading',cls:'c6'},
    {key:'vocab',ico:'📚',name:'Từ Vựng TOEIC',desc:'600 từ chia theo band 450→800+. Học đúng level, không học thừa không học thiếu.',tag:'Vocabulary',cls:'c7'},

  ];

  var h = '<div class="dash">';

  h += '<p>Nền tảng học TOEIC toàn diện từ ORI Academy — Luyện Part 1-7, AI lập kế hoạch, Từ vựng theo band điểm.<br><strong>TOEIC · Việc Làm · Hay Dùng</strong></p>';
  h += '<div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">';
  h += '<input class="name-input" placeholder="👋 Nhập tên bạn để ORI gọi nhé..." value="'+savedName+'" onchange="saveName(this)" style="max-width:220px">';
  h += '<a class="wb-cta" href="https://zalo.me/0906303373" target="_blank" style="margin:0">💬 Nhắn Zalo tư vấn</a>';
  h += '</div></div>';

  // Stats
  h += '<div class="stat-row">';
  h += '<div class="stat-card"><div class="stat-val">9</div><div class="stat-lbl">Công cụ miễn phí</div></div>';
  h += '<div class="stat-card"><div class="stat-val">Part 1-7</div><div class="stat-lbl">Đầy đủ 7 Part</div></div>';

  h += '<div class="stat-card"><div class="stat-val">Free</div><div class="stat-lbl">Không mất phí</div></div>';
  h += '</div>';

  // Learning Path Guide
  h += '<div class="path-guide">';
  h += '<h4>🗺️ Lộ trình gợi ý cho người mới</h4>';

  h += '<span class="path-step" onclick="go(\'placement\')">📝 Test Đầu Vào</span>';
  h += '<span class="path-arrow">→</span>';
  h += '<span class="path-step" onclick="go(\'planner\')">🤖 AI Lên Lộ Trình</span>';

  h += '<span class="path-step" onclick="go(\'part5\')">📖 Luyện Part 5</span>';

  h += '<span class="path-step" onclick="go(\'part1\')">📸 Luyện Part 1</span>';
  h += '<span class="path-arrow">→</span>';

  h += '</div></div>';

  [cards[0], cards[1]].forEach(function(c){
    h += buildCard(c);

  // TOEIC Parts
  h += '<div class="section-title">📝 Luyện TOEIC theo Part</div>';

  [cards[2], cards[3]].forEach(function(c){ h += buildCard(c); });
  // Part 3/4 coming soon
  h += '<div class="dash-card c4 coming-card"><span class="coming-badge">🔜 Sắp ra mắt</span><div class="dc-ico">💬</div><div class="dc-name">Part 3/4 — Conversations</div><div class="dc-desc">Hội thoại ngắn + dài. Luyện nghe hiểu context — đang phát triển.</div><span class="dc-tag">Listening</span></div>';
  [cards[4]].forEach(function(c){ h += buildCard(c); });
  // Part 6
  h += '<div class="dash-card c5" onclick="go(\'part6\')"><div class="dc-ico">📄</div><div class="dc-name">Part 6 — Text Completion</div><div class="dc-desc">Điền từ vào đoạn văn (Theme Bamboo Airways). Ngữ pháp + Từ vựng + Sentence Insertion.</div><span class="dc-tag">Reading</span></div>';

  h += '</div>';

  // Tools
  h += '<div class="section-title">🧰 Công cụ bổ trợ</div>';
  h += '<div class="dash-grid">';
  [cards[6], cards[7], cards[8]].forEach(function(c){
    h += buildCard(c);
  });
  h += '</div>';

  h += '</div>';
  document.getElementById('main').innerHTML = h;

  // Stagger animation
  var allCards = document.querySelectorAll('.dash-card');
  allCards.forEach(function(card, i){
    card.style.opacity = '0';
    card.style.transform = 'translateY(15px)';
    setTimeout(function(){
      card.style.transition = 'all .35s cubic-bezier(.4,0,.2,1)';
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
    }, 60 * i);
  });
}

function buildCard(c){
  var h = '<div class="dash-card '+c.cls+'" onclick="go(\''+c.key+'\')">';
  h += '<div class="dc-ico">'+c.ico+'</div>';
  h += '<div class="dc-name">'+c.name+'</div>';
  h += '<div class="dc-desc">'+c.desc+'</div>';
  h += '<span class="dc-tag">'+c.tag+'</span>';
  h += '</div>';
  return h;
}

// Init
renderDashboard();
</script>
